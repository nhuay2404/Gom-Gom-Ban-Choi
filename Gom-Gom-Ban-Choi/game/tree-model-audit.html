<!doctype html><meta charset="utf-8"><title>Đo tải model cây 3D</title><style>body{font:14px monospace;white-space:pre-wrap;padding:20px}</style><script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script><h1>Đo tải model cây 3D</h1><pre id="result">Đang dựng và đếm mesh…</pre><script type="module">
try{
const {buildModel,modelIds}=await import('./deco/deco-room.mjs');
const {CATALOG}=await import('./deco/deco-data.mjs');
const {gardenCorners}=await import('./deco/scenes/garden.mjs');
const {buildMeadow}=await import('./deco/scenes/meadow.mjs');
function stats(node){let triangles=0,meshes=0,draws=0,instances=0,alphaTris=0,shadowTris=0,updates=0,emptyMeshes=0;const geometries=new Set(),materials=new Set();node.traverse(o=>{if(o.userData.update)updates++;if(!o.isMesh)return;meshes++;const g=o.geometry,n=o.isInstancedMesh?o.count:1;if(!g.attributes.position?.count)emptyMeshes++;const count=Math.min(g.index?.count??g.attributes.position?.count??0,g.drawRange.count);const tris=count/3*n;triangles+=tris;instances+=o.isInstancedMesh?n:0;geometries.add(g);const ms=Array.isArray(o.material)?o.material:[o.material];ms.forEach(m=>materials.add(m));draws+=Array.isArray(o.material)?g.groups.length:1;if(ms.some(m=>m.transparent||m.alphaTest>0))alphaTris+=tris;if(o.castShadow)shadowTris+=tris;});let geoBytes=0;for(const g of geometries){geoBytes+=g.index?.array.byteLength??0;for(const a of Object.values(g.attributes))geoBytes+=a.array?.byteLength??0;}return{triangles,meshes,draws,instances,alphaTris,shadowTris,emptyMeshes,geoKB:Math.round(geoBytes/1024),materials:materials.size,updates};}
const ids=['swingtree','swingtree-treehouse','swingtree-bench','parasol-tree','plant','plant-cactus','plant-tulips','kplant','kplant-fig','kplant-herbs','catnip','catnip-pot','fence-hedge','yfence-hedge','kfence-hedge','flowers','flowers-tulips','sunflowers','sunflowers-lavender','greenhouse','greenhouse-tunnel','vegbed','vegbed-corn','veggies-flowers','kbench-planter','closet-ladder','bwall-lavender'];
const models=[],failures=[];
for(const id of ids){try{const entry=CATALOG.find(e=>e.id===id),node=buildModel(id);models.push({id,name:entry?.name,zone:entry?.zone,...stats(node)});node.traverse(o=>{o.geometry?.dispose();});}catch(e){failures.push({id,error:e.message});}}
const corners=gardenCorners();const bushes=corners.children.map((node,i)=>({id:'corner-bush-'+(i+1),name:'Garden corner bush '+(i+1),...stats(node)}));
const meadow=buildMeadow({x0:-7,x1:16,z0:-7,z1:7});const environment=stats(meadow.group??meadow.root??meadow);
const {withoutMerging}=await import('./deco/render/mesh-detail.mjs');const rawMeadow=withoutMerging(()=>buildMeadow({x0:-7,x1:16,z0:-7,z1:7}));const props=rawMeadow.root.children[2];const environmentBreakdown={raw:stats(rawMeadow.root),propCount:props.children.length,trees:props.children.slice(0,46).map(stats),shrubs:props.children.slice(46,86).map(stats)};document.getElementById('result').textContent=JSON.stringify({environmentBreakdown,catalogTotal:modelIds().length,models:models.sort((a,b)=>b.triangles-a.triangles),bushes,environment,failures},null,2);
}catch(e){document.getElementById('result').textContent=JSON.stringify({error:e.message,stack:e.stack});}
</script>
