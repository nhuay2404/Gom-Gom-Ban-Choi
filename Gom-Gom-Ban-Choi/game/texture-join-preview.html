<script type="module">
import { syrupMaskAt, syrupAtlasStyle } from './ui/syrup-autotile.mjs';
const rows=['11110011','10110011','11110000','00010110','11011110','11000010','01111010','00000000'];
for(const tile of document.querySelectorAll('.syrup-tile')) {
 const row=Number(tile.style.getPropertyValue('--row')), col=Number(tile.style.getPropertyValue('--col'));
 tile.style.cssText=syrupAtlasStyle(syrupMaskAt(row,col,(r,c)=>rows[r]?.[c]==='1'));
}
</script><style>body.zoom .board{--bw:640px;--c:73.875px;width:640px;height:640px}</style><script>if(new URLSearchParams(location.search).has("zoom"))document.body.classList.add("zoom")</script><script type="module">
import {catMarkup} from './ui/cat-art.mjs';
const grassBoard=document.querySelectorAll('.board')[1];
const section=document.createElement('section');
section.innerHTML='<h2>Cỏ lõm nhẹ · Pet đặt phía trên</h2>';
const petBoard=grassBoard.cloneNode(true);
petBoard.style.setProperty('--tilt','0deg');
const cells=[...petBoard.querySelectorAll('.cell.grass')];
const pets=['orange','shiba','white','dalmatian','gray','siamese','golden','tuxedo'];
[0,2,5,9,13,18,22,27].forEach((index,k)=>{
 if(!cells[index])return;
 cells[index].classList.add('locked');
 cells[index].insertAdjacentHTML('beforeend',catMarkup[pets[k]]);
});
section.append(petBoard);document.querySelector('main').append(section);
</script>
