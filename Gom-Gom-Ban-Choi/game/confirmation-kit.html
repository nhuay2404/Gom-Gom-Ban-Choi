<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gom Gom · Confirmation UI</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&family=Nunito:wght@700;800;900&display=swap">
<link rel="stylesheet" href="./ui/play/base.css"><link rel="stylesheet" href="./ui/shared/base.css"><link rel="stylesheet" href="./ui/shared/store.css"><link rel="stylesheet" href="./ui/deco/deco.css"><link rel="stylesheet" href="./ui/shared/confirmation.css">
<style>body{margin:0;display:block;overflow:auto;background:#e8e1cf;color:#674626;font-family:Nunito,sans-serif;--frame-w:min(100vw,393px);--u:1px}main{max-width:900px;margin:auto;padding:30px 18px}h1{font:800 32px/1.1 'Baloo 2',sans-serif;margin:0 0 8px}.intro{max-width:580px;line-height:1.6}.examples{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin-top:22px}.example{padding:20px;text-align:left;background:#fff8e5;border:2px solid #d9c49c;border-radius:18px;color:#674626;cursor:pointer}.example b{display:block;font:800 21px 'Baloo 2',sans-serif}.example span{font:800 12px Nunito,sans-serif;line-height:1.5}.result{padding-top:20px;font-size:13px}.confirm-dialog{zoom:1!important}button:focus-visible{outline:3px solid #2586aa;outline-offset:3px}</style></head>
<body><main><h1>Confirmation popups</h1><p class="intro">Gom Gom · Cream panels, clear choices, and the game’s own icons. Open an example to try it. These previews do not change your game save.</p><div class="examples"></div><p class="result" role="status" aria-live="polite">Choose an example.</p></main>
<script type="module">
import { openConfirmation } from './ui/shared/confirmation-view.mjs';
const gem=n=>`<i class="ico-gem"></i>${n}`;
const items=[
{name:'Leave level',note:'Keep playing is the main action.',title:'Leave this level?',body:'<p>Moves used and boosters spent won’t come back.</p>',choices:[{id:'keep',label:'Keep playing',autofocus:true},{id:'leave',label:'Leave',style:'danger'}]},
{name:'Restart level',note:'The confirmation says Restart.',title:'Restart this level?',body:'<p>Moves used and boosters spent won’t come back.</p>',choices:[{id:'keep',label:'Keep playing',autofocus:true},{id:'restart',label:'Restart',style:'danger'}]},
{name:'Not enough gems',note:'Resource art and a clear next step.',title:'Not enough gems',icon:'./assets/img/shop/gem-packs/gems_200-modern.png',body:`<p>You need ${gem(25)} more.</p>`,choices:[{id:'buy',label:'Buy gems'},{id:'no',label:'Not now',style:'ghost'}]},
{name:'Not enough coins',note:'A longer description wraps cleanly.',title:'Not enough coins',icon:'./assets/img/idle-reward/coin-stack.png',body:'<p>You need <i class="ico-coin"></i>650 more for Garden expansion. Use all your coins and pay the rest with gems?</p>',choices:[{id:'pay',label:`Buy · ${gem(12)}`},{id:'no',label:'Not now',style:'ghost'}]},
{name:'Continue',note:'Video icon on a gold reward button.',title:'So close!',className:'continue',icon:'./assets/img/play/booster-moves.png',body:'<p class="continue-progress">You have <b>950/1,000</b> points.</p><p>Still missing: <b>50 points</b></p>',choices:[{id:'gems',label:`+5 moves · ${gem(20)}`},{id:'ad',label:'▶ Watch ad: +3 moves',style:'ad'},{id:'quit',label:'Give up',style:'ghost'}]},
{name:'Empty booster',note:'Four choices using the same button set.',title:'Hammer',icon:'./assets/img/play/booster-hammer.png',body:`<p>None left! You have ${gem(50)}</p>`,choices:[{id:'ad',label:'▶ Watch ad: +1',style:'ad'},{id:'one',label:`+1 · ${gem(10)}`},{id:'pack',label:`+3 · ${gem(25)}`},{id:'no',label:'Not now',style:'ghost'}]},
{name:'Next areas',note:'The existing requirements inside the new frame.',title:'Next areas',className:'area-sheet',body:'<section class="area-row"><h3>Garden expansion</h3><ul><li><i></i>Build every spot in the garden <b>1/10</b></li><li><i></i>Pay <span class="amt"><i class="ico-coin"></i>650</span></li></ul></section><section class="area-row" data-state="soon"><h3>Living room</h3><ul><li><i></i>Open the garden expansion first</li></ul></section>',choices:[{id:'build',label:'Go build'},{id:'close',label:'Later',style:'ghost'}]},
{name:'Starter Pack',note:'Offer art and price use the shared shell.',title:'Starter Pack',className:'offer',icon:'./assets/img/home/icon-starter-matte.png',body:`<p class="offer-contents">${gem(200)} · 3× every booster</p><p>Ends in 23h 59m</p>`,choices:[{id:'buy',label:'$1.99'},{id:'no',label:'Later',style:'ghost'}]},
{name:'Gem store',note:'A scrolling list of purchase options.',title:'Buy gems',className:'gem-store',body:`<p>You need ${gem(25)} more.</p>`,choices:[200,550,1200,2600,7000,16000].map((n,i)=>({id:String(n),label:`<span class="gs-gems">${gem(n.toLocaleString('en-US'))}</span><span class="gs-price">$${[1.99,4.99,9.99,19.99,49.99,99.99][i]}</span>`})).concat({id:'close',label:'Close',style:'ghost'})},
{name:'Unavailable action',note:'Disabled button, Close and Escape.',title:'Come back tomorrow',body:'<p>You’ve collected today’s video rewards.</p>',choices:[{id:'ad',label:'Watch video',style:'ad',disabled:true},{id:'close',label:'Close',style:'ghost'}]},
];
const grid=document.querySelector('.examples');
items.forEach(item=>{const button=document.createElement('button');button.className='example';button.innerHTML=`<b>${item.name}</b><span>${item.note}</span>`;button.onclick=async()=>{const choice=await openConfirmation(item);document.querySelector('.result').textContent=`${item.name}: ${choice??'dismissed'}`};grid.append(button)});
</script></body></html>
