<!doctype html>
<html lang="vi"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mở hộp cạc tông</title>
<style>
body{margin:0;padding:24px;font:16px system-ui;background:#faf0d8;color:#70462d;text-align:center}h1{font-size:24px}.stage{display:grid;place-items:center;min-height:340px;background:#e6d8b9;border-radius:20px;margin:auto;max-width:600px}.sprite{width:300px;height:300px;background:url('assets/img/board/cardboard-opening/spritesheet.png') 0 0/1200px 300px no-repeat}.frames{display:flex;justify-content:center;flex-wrap:wrap;margin-top:24px;gap:12px}figure{margin:0}figure img{width:160px;height:160px;object-fit:contain}figcaption{font-size:14px}button{padding:10px 24px;margin:16px;border:2px solid #70462d;border-radius:12px;background:#ffe2a3;color:#70462d;font:inherit;cursor:pointer}
</style>
<h1>Mở hộp · Bóc băng keo</h1><div class="stage"><div class="sprite" id="sprite" role="img" aria-label="Chuyển động bóc băng keo và mở hộp"></div></div><button id="replay">Xem lại</button>
<div class="frames"><figure><img src="assets/img/board/cardboard-opening/frame-0.png"><figcaption>0 · Đóng</figcaption></figure><figure><img src="assets/img/board/cardboard-opening/frame-1.png"><figcaption>1 · Bóc keo</figcaption></figure><figure><img src="assets/img/board/cardboard-opening/frame-2.png"><figcaption>2 · Hé nắp</figcaption></figure><figure><img src="assets/img/board/cardboard-opening/frame-3.png"><figcaption>3 · Mở hộp</figcaption></figure></div>
<script>const sprite=document.getElementById('sprite');let timers=[];function play(){timers.forEach(clearTimeout);sprite.style.backgroundPositionX='0px';timers=[setTimeout(()=>sprite.style.backgroundPositionX='-300px',400),setTimeout(()=>sprite.style.backgroundPositionX='-600px',580),setTimeout(()=>sprite.style.backgroundPositionX='-900px',760)];}document.getElementById('replay').onclick=play;play();</script></html>
