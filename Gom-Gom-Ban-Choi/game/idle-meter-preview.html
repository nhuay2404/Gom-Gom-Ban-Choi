<!doctype html><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="ui/shared/idle-reward.css"><style>body{margin:0;background:#729a79;font-family:Arial}.idle-meter{position:relative!important;margin:16px auto!important}.out{text-align:center;color:white}</style><div class="idle-claim idle-meter store-dialog"></div><p class="out">Preview only · no save changes</p><script type="module">import{idleRewardOptions,startIdleMeter}from './menu/idle-reward-view.mjs';const d=document.querySelector('.idle-meter'),o=idleRewardOptions(1147);d.innerHTML='<h2>'+o.title+'</h2>'+o.body+'<div class="store-choices">'+o.choices.map(c=>'<button class="pill-button '+c.style+'" data-choice="'+c.id+'">'+c.label+'</button>').join('')+'</div>';const factor=startIdleMeter(d,1147);d.addEventListener('click',e=>{const c=e.target.closest('[data-choice]');if(c)document.querySelector('.out').textContent=c.dataset.choice==='ad'?'Locked x'+factor()+' · '+Math.round(1147*factor())+' coins after video':'Base claim: 1,147 coins';});</script>
