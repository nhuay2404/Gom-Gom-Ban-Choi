<!doctype html><meta charset="utf-8"><title>Siro dâu · Rót và đóng nắp</title><style>body{background:#fbeaf1;color:#663449;font:16px system-ui;max-width:800px;margin:24px auto}#stage{width:192px;height:320px;background-image:url(syrup-bottle-close-60fps.png);transform:scale(1.4);transform-origin:top left;margin:20px 0 145px}button,input{margin:12px}img{width:100%}</style><h1>Siro dâu · Rót và đóng nắp</h1><p>120 frame · 60 FPS · 2 giây · Sprite tile và bình gốc trong game.</p><button id="play">Phát / Dừng</button><input id="seek" type="range" min="0" max="119" value="0"><span id="label"></span><div id="stage"></div><p><a href="syrup-bottle-close-60fps.png">Sprite sheet toàn bộ hiệu ứng</a> · <a href="syrup-pour-60fps.png">Lớp siro riêng</a> · <a href="syrup-pour-60fps.json">Tọa độ frame JSON</a></p><img src="sprite-contact-sheet.png"><script>let running=true,start=performance.now();const seek=document.querySelector('#seek');function draw(i){document.querySelector('#stage').style.backgroundPosition=(-(i%12)*192)+'px '+(-Math.floor(i/12)*320)+'px';seek.value=i;document.querySelector('#label').textContent='Frame '+i+' / 119 · '+(i<84?'Siro chảy':i<109?'Đậy nắp':'Nắp khớp vào bình')}document.querySelector('#play').onclick=()=>{running=!running;start=performance.now()-Number(seek.value)/60*1000};seek.oninput=()=>{running=false;draw(Number(seek.value))};function tick(now){if(running)draw(Math.min(119,Math.floor(((now-start)%2600)/1000*60)));requestAnimationFrame(tick)}requestAnimationFrame(tick)</script>
